;==========================================================
; POLYBAR CONFIGURATION // NORD THEME
;==========================================================

[colors]
background = #202430
background-alt = #2E3440
foreground = #D8DEE9
foreground-alt = #E5E9F0

primary = #88C0D0
secondary = #81A1C1
urgent = #BF616A
success = #A3BE8C

[bar/mybar]
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-2 = "Hack Nerd Font:size=11;2"
font-3 = "Noto Sans:size=10;2"
font-4 = "Noto Sans Symbols:size=10;2"
font-5 = "Noto Sans Symbols2:size=10;2"
; --- GEOMETRY & PLACEMENT ---
width = 98%
height = 24pt
offset-x = 1%
offset-y = 8pt
bottom = false
radius = 8.0
border-size = 1px
border-color = #89A3C2

; --- LOOK & FEEL ---
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt
padding-left = 1
padding-right = 1
module-margin = 1

; --- FONTS ---

; --- LAYOUT MANAGEMENT ---
modules-left = xworkspaces
modules-center = date
modules-right = notifications separator kdeconnect separator pulseaudio battery separator tray separator powermenu

; --- COMPATIBILITY & RENDERING FIXES ---
wm-restack = generic
override-redirect = true

enable-ipc = true

; ==========================================================
; MODULE DEFINITIONS
; ==========================================================

[module/xworkspaces]
type = internal/xworkspaces

label-active = "[%index%]"
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background-alt}
label-active-padding = 1

label-occupied = "[%index%]"
label-occupied-foreground = ${colors.secondary}
label-occupied-padding = 1

label-urgent = "[%index%]"
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 1

label-empty = "[%index%]"
label-empty-foreground = #4C566A
label-empty-padding = 1

[module/date]
type = internal/date
interval = 5
date = %I:%M
date-alt = %A, %d %B, %Y
label = %date%
label-foreground = ${colors.foreground}
label-font = 2

[module/pulseaudio]
type = internal/pulseaudio

format-volume = VOL <label-volume>
format-volume-foreground = ${colors.secondary}
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

label-muted = MUTED
label-muted-foreground = ${colors.urgent}

; opens pulseaudio volume control on right click
click-right = pavucontrol &

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT1
adapter = ACAD
poll-interval = 5
 
format-charging = %{A1:xfce4-popup-power-manager:}<label-charging>%{A}
format-discharging = %{A1:xfce4-popup-power-manager:}<label-discharging>%{A}
format-full = %{A1:xfce4-popup-power-manager:}<label-full>%{A}
format-low = %{A1:xfce4-popup-power-manager:}<label-low>%{A}
 
label-charging = CHG %percentage%%
label-charging-foreground = ${colors.success}
label-discharging = BAT %percentage%%
label-discharging-foreground = ${colors.foreground}
label-full = FULL
label-full-foreground = ${colors.success}
label-low = %percentage%%
label-low-foreground = ${colors.urgent}
click-right = ~/.config/polybar/scripts/battery-limit-toggle.sh

[module/network]
type = internal/network

; REPLACE with your actual interface name. Find it with:
;   nmcli device status
; or
;   ip link show

interface = wlp1s0
interval = 5

format-connected = ONLINE
format-connected-foreground = ${colors.secondary}
label-connected = %essid%

format-disconnected = OFFLINE
format-disconnected-foreground = #4C566A

click-right = nm-connection-editor &


[module/kdeconnect]
type = custom/script
exec = ~/.config/polybar/scripts/kdeconnect.sh
interval = 5
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 1

; Left-click opens KDE Connect settings / manager
click-left = ~/.config/polybar/scripts/kdeconnect-actions.sh gui
; Middle-click rings/finds your phone
click-middle = ~/.config/polybar/scripts/kdeconnect-actions.sh ring
; Right-click opens KDE Connect SMS app
click-right = ~/.config/polybar/scripts/kdeconnect-actions.sh sms

[module/powermenu]
type = custom/text
label = ⏻
label-font = 3
label-foreground = ${colors.urgent}
click-left = ~/.config/rofi/powermenu/type-1/powermenu.sh &
label-padding-left = 1
label-padding-right = 3

[module/separator]
type = custom/text
format = "│"
content-foreground = #4C566A
content-padding = 0

[module/tray]
type = internal/tray
tray-spacing = 2px
tray-padding = 2px
tray-size = 60%
tray-background = ${colors.background}

[module/notifications]
type = custom/script
exec = ~/.config/polybar/scripts/notification.sh
interval = 2
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/notification-actions.sh history
click-middle = ~/.config/polybar/scripts/notification-actions.sh close-all
click-right = ~/.config/polybar/scripts/notification-actions.sh toggle-dnd
